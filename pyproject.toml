[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costsight"
version = "0.2.0"
description = "Self-hosted unified FinOps tool for AWS — cost visibility, audit, and reporting with zero data custody."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "costsight contributors" }]
keywords = ["aws", "cost", "finops", "billing", "audit", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.7",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
exporters = [
    "reportlab>=4.1",
    "slack-sdk>=3.27",
]
cur = [
    "duckdb>=1.0",
    "pyarrow>=15.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=0.1",  # required by starlette's TestClient
    "moto[ec2,rds,elbv2,sts,organizations]>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
all = [
    "costsight[cli,web,exporters,cur]",
]

[project.scripts]
costsight = "costsight.cli:main"

[project.urls]
Homepage = "https://github.com/TirthTeraiya/costsight"
Issues = "https://github.com/TirthTeraiya/costsight/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["costsight*"]

[tool.setuptools.package-data]
costsight = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.9"
strict_optional = true
warn_unused_ignores = true
