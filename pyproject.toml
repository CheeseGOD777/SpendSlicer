[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spendslicer"
dynamic = ["version"]
description = "Self-hosted AWS cost visibility and waste audit — runs on your machine, against your own AWS credentials."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tirth Teraiya" }]
keywords = ["aws", "cost", "finops", "billing", "audit", "cloud", "devops"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
exporters = [
    "fpdf2>=2.8",
    "slack-sdk>=3.27",
]
cur = [
    "duckdb>=1.0",
]
# Native desktop shell (the .dmg / .exe builds). pywebview renders the
# dashboard in the OS webview: WebKit on macOS, WebView2 on Windows.
desktop = [
    "pywebview>=5.1",
    "pyobjc-core>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.1; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit>=10.1; sys_platform == 'darwin'",
    "pythonnet>=3.0; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.12",  # starlette 1.6+ TestClient wants httpx2, not httpx
    "moto[ec2,rds,elbv2,sts,organizations]>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.6",
]
all = [
    "spendslicer[web,exporters,cur]",
]

[project.scripts]
spendslicer = "spendslicer.cli:main"
spendslicer-web = "spendslicer.web.app:main"

[project.gui-scripts]
spendslicer-desktop = "spendslicer.desktop:main"

[project.urls]
Homepage = "https://github.com/CheeseGOD777/spendslicer"
Repository = "https://github.com/CheeseGOD777/spendslicer"
Issues = "https://github.com/CheeseGOD777/spendslicer/issues"
Changelog = "https://github.com/CheeseGOD777/spendslicer/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "spendslicer.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["spendslicer*"]

[tool.setuptools.package-data]
# The prebuilt React bundle ships inside the wheel so `pip install spendslicer`
# serves the dashboard without needing Node.
spendslicer = ["web/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["frontend/dist", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends()/Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import inside functions to keep monkeypatch scopes tight.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:spendslicer.*",
]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
