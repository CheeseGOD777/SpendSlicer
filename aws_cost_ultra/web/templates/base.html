<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}aws-cost-ultra{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/static/css/main.css">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" defer></script>
  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="/static/js/charts.js" defer></script>
</head>

<body x-data="acuShell()" x-cloak>

  <!-- ════════════════════════════════════════════════
       SIDEBAR
  ═════════════════════════════════════════════════ -->
  <aside class="sidebar">

    <!-- Logo -->
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">ACU</div>
      <div class="sidebar-logo-text">aws-cost-<span>ultra</span></div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      <div class="nav-section-label">Visibility</div>

      <a href="/?profile={{ active_profile }}&period={{ period }}"
         class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="6" height="6" rx="1"/>
          <rect x="9" y="1" width="6" height="6" rx="1"/>
          <rect x="1" y="9" width="6" height="6" rx="1"/>
          <rect x="9" y="9" width="6" height="6" rx="1"/>
        </svg>
        <span>Dashboard</span>
      </a>

      <a href="/services?profile={{ active_profile }}&period={{ period }}"
         class="nav-item {% if active_page == 'services' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 4h12M2 8h8M2 12h10"/>
        </svg>
        <span>Services</span>
      </a>

      <a href="/resources?profile={{ active_profile }}&period={{ period }}"
         class="nav-item {% if active_page == 'resources' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="12" height="3" rx="0.5"/>
          <rect x="2" y="7" width="12" height="3" rx="0.5"/>
          <rect x="2" y="11" width="12" height="3" rx="0.5"/>
          <circle cx="4" cy="4.5" r="0.5" fill="currentColor"/>
          <circle cx="4" cy="8.5" r="0.5" fill="currentColor"/>
          <circle cx="4" cy="12.5" r="0.5" fill="currentColor"/>
        </svg>
        <span>Resources</span>
      </a>

      <a href="/trends?profile={{ active_profile }}&period=12m"
         class="nav-item {% if active_page == 'trends' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <polyline points="1,12 5,7 8,9 12,4 15,6"/>
          <path d="M12,1h3v3"/>
        </svg>
        <span>Trends</span>
      </a>

      <div class="nav-section-label" style="margin-top:8px">FinOps</div>

      <a href="/audit?profile={{ active_profile }}&period={{ period }}"
         class="nav-item {% if active_page == 'audit' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6.5"/>
          <path d="M8 5v4M8 11v.5"/>
        </svg>
        <span>Audit</span>
      </a>

      <a href="/export?profile={{ active_profile }}&period={{ period }}"
         class="nav-item {% if active_page == 'export' %}active{% endif %}">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 1v9M5 7l3 3 3-3"/>
          <path d="M2 12v2a1 1 0 001 1h10a1 1 0 001-1v-2"/>
        </svg>
        <span>Export</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      v0.2.0
    </div>
  </aside>

  <!-- ════════════════════════════════════════════════
       MAIN WRAPPER
  ═════════════════════════════════════════════════ -->
  <div class="main-wrapper">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-title">{% block topbar_title %}{% endblock %}</div>

      <div class="topbar-controls">

        <span class="mode-badge" title="{{ cost_basis_label }}">Pre-credit</span>

        <!-- Period picker -->
        <form method="GET" action="" id="period-form">
          <input type="hidden" name="profile" value="{{ active_profile }}">
          <select name="period" class="select-pill"
                  onchange="document.getElementById('period-form').submit()">
            {% for val, label in periods %}
            <option value="{{ val }}" {% if period == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </form>

        <!-- AWS CLI profile picker -->
        <form method="GET" action="" id="profile-form">
          <input type="hidden" name="period" value="{{ period }}">
          {% if region is defined %}<input type="hidden" name="region" value="{{ region }}">{% endif %}
          <select name="profile" class="select-pill" title="AWS CLI profile from ~/.aws/credentials"
                  onchange="document.getElementById('profile-form').submit()">
            {% for c in profile_choices %}
            <option value="{{ c.profile }}" {% if active_profile == c.profile %}selected{% endif %}>
              {{ c.label }}
            </option>
            {% endfor %}
          </select>
        </form>

        <!-- Refresh -->
        <button class="btn-icon" title="Clear cache & refresh"
                hx-post="/api/cache/clear?profile={{ active_profile }}"
                hx-on::after-request="window.location.reload()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5"/>
            <polyline points="13.5,2.5 13.5,5.5 10.5,5.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page content -->
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Alpine app state -->
  <script>
    function acuShell() {
      return {
        init() {},
      };
    }
  </script>

</body>
</html>
