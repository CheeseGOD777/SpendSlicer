{% extends "base.html" %}
{% block title %}Trends — aws-cost-ultra{% endblock %}
{% block topbar_title %}Trends{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-title">Cost Trends</div>
  <div class="page-subtitle">Monthly spend trajectory · {{ active_profile }}</div>
</div>

<!-- Main trend chart card -->
<div class="card mb-6">
  <div class="card-header">
    <div class="section-title">Monthly Cost</div>
  </div>
  <div class="card-body">
    <div style="height:320px; position:relative;">
      <canvas id="main-trend-chart"
              data-src="/api/cost/trend/data?profile={{ active_profile }}&period={{ period }}">
      </canvas>
    </div>
  </div>
</div>

<!-- Period comparison table -->
<div class="card">
  <div class="card-header">
    <div class="section-title">Period Detail</div>
  </div>
  <div id="trend-table-wrap"
       hx-get="/api/cost/trend-table?profile={{ active_profile }}&period={{ period }}"
       hx-trigger="load">
    <div style="padding:16px">
      {% for _ in range(6) %}
      <div class="skeleton skel-table-row mb-4"></div>
      {% endfor %}
    </div>
  </div>
</div>

<!-- Init the main chart once Alpine + DOM are ready -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('main-trend-chart');
  if (!canvas) return;
  const url = canvas.dataset.src;
  fetch(url)
    .then(r => r.json())
    .then(d => {
      if (d.labels && d.values) buildTrendChart('main-trend-chart', d.labels, d.values);
    })
    .catch(() => {});
});
</script>
{% endblock %}
