name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo. Without this the workflow
# inherits the repository default, which may be read-write, handing a
# write-capable GITHUB_TOKEN to every third-party action in the job.
permissions:
  contents: read

jobs:
  python:
    name: Backend · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,cur,exporters,dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  dashboard:
    name: Dashboard bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # spendslicer/web/static is committed so that `pip install spendslicer` and
      # ./run.sh work without a Node toolchain. If a PR changes frontend/src
      # without rebuilding, the committed bundle goes stale and users get the
      # old dashboard. Vite's filenames are content-hashed, so a real source
      # change always shows up here.
      - name: Committed bundle is up to date
        run: |
          if ! git diff --quiet -- spendslicer/web/static; then
            echo "::error::spendslicer/web/static is stale. Run 'cd frontend && npm run build' and commit the result."
            git diff --stat -- spendslicer/web/static
            exit 1
          fi
          echo "Bundle matches frontend/src."

  desktop-smoke:
    name: Desktop package · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,cur,desktop,build]" Pillow

      - run: npm ci && npm run build
        working-directory: frontend

      - name: Icons
        run: python packaging/make_icons.py

      # Catches spec rot — a missing hidden import or uncollected data file —
      # on every PR rather than at tag time.
      - name: PyInstaller
        run: pyinstaller packaging/spendslicer.spec --noconfirm
