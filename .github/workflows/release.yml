name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14+ runners are Apple Silicon; macos-13 is the last Intel
          # image. PyInstaller cannot cross-compile, so each architecture needs
          # its own runner — a single "universal" job is not an option.
          - os: macos-14
            label: macOS (Apple Silicon)
            arch: arm64
          - os: macos-13
            label: macOS (Intel)
            arch: x86_64
          - os: windows-latest
            label: Windows (x64)
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,cur,exporters,desktop,build]" Pillow

      - name: Build macOS .dmg
        if: runner.os == 'macOS'
        run: ./packaging/build_macos.sh
        env:
          # Populate these repository secrets to ship a signed, notarised build.
          # Left empty, the job still succeeds and produces an unsigned .dmg.
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows .zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
        env:
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.dmg *.zip; do
            [ -e "$f" ] || continue
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: costsight-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.sha256
          body: |
            ## Install

            **macOS** — download the `.dmg` for your chip (`arm64` for Apple
            Silicon, `x86_64` for Intel), open it, drag CostSight to
            Applications.

            These builds are **not signed or notarised yet**, so Gatekeeper
            will say the app "is damaged and can't be opened". It isn't — that
            is what macOS says about any unsigned download. Clear the
            quarantine flag once:

            ```
            xattr -dr com.apple.quarantine /Applications/CostSight.app
            ```

            **Windows** — download the `.zip`, extract it anywhere, run
            `CostSight.exe`. SmartScreen will warn on first run because the
            binary is unsigned: click **More info** → **Run anyway**.

            **From source** (no binary, no warnings):

            ```
            pip install costsight[web,cur]
            costsight-web
            ```

            Verify a download with the matching `.sha256` file.

            ## What it does

            CostSight runs entirely on your machine against your own AWS CLI
            profiles. No account linking, no telemetry, no cost data leaving
            your laptop.
